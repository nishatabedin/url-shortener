services:
  mysql:
    image: mysql:8.0
    profiles:
      - dev
      - prod
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql-mode="STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"

  redis:
    image: redis:7-alpine
    profiles:
      - dev
      - prod
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin:latest
    profiles:
      - dev
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    ports:
      - "8083:80"

  kgs-dev:
    build:
      context: ./kgs-service
      dockerfile: Dockerfile.dev
    profiles:
      - dev
    env_file:
      - ./kgs-service/.env.dev
    depends_on:
      - mysql
      - redis
    volumes:
      - ./kgs-service:/var/www/html
    ports:
      - "8081:80"

  kgs-prod:
    build:
      context: ./kgs-service
    profiles:
      - prod
    env_file:
      - ./kgs-service/.env.prod
    depends_on:
      - mysql
      - redis
    ports:
      - "8081:80"

  shortener-dev:
    build:
      context: ./shortener-api
      dockerfile: Dockerfile.dev
    profiles:
      - dev
    env_file:
      - ./shortener-api/.env.dev
    depends_on:
      - mysql
      - redis
      - kgs-dev
    volumes:
      - ./shortener-api:/var/www/html
    ports:
      - "8082:80"

  shortener-prod:
    build:
      context: ./shortener-api
    profiles:
      - prod
    env_file:
      - ./shortener-api/.env.prod
    depends_on:
      - mysql
      - redis
      - kgs-prod
    ports:
      - "8082:80"

  prometheus:
    image: prom/prometheus:v2.52.0
    profiles:
      - observability
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:2.9.8
    profiles:
      - observability
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.8
    profiles:
      - observability
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.56
    profiles:
      - observability
    ports:
      - "16686:16686"
      - "4317:4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    profiles:
      - observability
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./infra/observability/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  k6:
    image: grafana/k6:0.52.0
    profiles:
      - loadtest
    entrypoint: ["k6"]
    volumes:
      - ./k6:/scripts:ro

volumes:
  mysql_data:
  grafana_data:
  loki_data:
